<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Low Stock Alert</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body {
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: #f8fafc;
        font-family: 'Poppins', sans-serif;
    }
    .container {
        margin-top: 50px;
    }
    .card {
        background: rgba(30, 41, 59, 0.85);
        border-radius: 15px;
        padding: 25px;
    }
    .alert-icon {
        font-size: 40px;
        color: #ef4444;
    }

  
    h3 {
        color: #f8fafc; 
        font-weight: 600;
    }
</style>
</head>

<body>

<div class="container">
    <div class="card">
        <h3 class="mb-3">
            <span class="alert-icon">⚠</span>
            Low Stock Alert (≤ <span th:text="${limit}"></span>)
        </h3>

        <table class="table table-dark table-hover mt-4">
            <thead>
            <tr>
                <th>ID</th>
                <th>Product</th>
                <th>Quantity</th>
                <th>Status</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="product : ${lowStockProducts}">
                <td th:text="${product.id}"></td>
                <td th:text="${product.name}"></td>
                <td th:text="${product.quantity}"></td>
                <td>
                    <span class="badge bg-danger">LOW STOCK</span>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(lowStockProducts)}">
                <td colspan="4" class="text-center text-success">
                    ✅ All products are sufficiently stocked
                </td>
            </tr>
            </tbody>
        </table>
        <div class="text-center mt-4">
            <a th:href="@{/manager/dashboard}" class="btn btn-outline-light">
                ← Back to Dashboard
            </a>
        </div>
    </div>
</div>

</body>
</html>
