<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Purchase & Sales Entries</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #f1f5f9;
        }
        .container {
            width: 95%;
            max-width: 800px;
        }
        .title {
            text-align: center;
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 40px;
        }
        .option-card {
            background: rgba(30, 41, 59, 0.85);
            border-radius: 18px;
            padding: 25px 30px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: #f8fafc;
            transition: 0.4s;
        }
        .option-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
        }
        .left {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .icon {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
        }
        .purchase {
            background: linear-gradient(135deg, #22c55e, #16a34a);
        }
        .sales {
            background: linear-gradient(135deg, #ef4444, #b91c1c);
        }
        .arrow {
            font-size: 20px;
            color: #94a3b8;
        }
        .back {
            text-align: center;
            margin-top: 30px;
        }
        .back a {
            text-decoration: none;
            color: #f8fafc;
            padding: 10px 25px;
            border-radius: 30px;
            border: 1px solid #334155;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="title">Purchase & Sales Entries</div>

  
    <a th:href="@{/manager/purchase-entry}" class="option-card">
        <div class="left">
            <div class="icon purchase">
                <i class="fas fa-cart-plus"></i>
            </div>
            <div>
                <h3>Purchase Entry</h3>
                <p>Add stock received from suppliers</p>
            </div>
        </div>
        <i class="fas fa-arrow-right arrow"></i>
    </a>

  
    <a th:href="@{/manager/sales-entry}" class="option-card">
        <div class="left">
            <div class="icon sales">
                <i class="fas fa-shopping-cart"></i>
            </div>
            <div>
                <h3>Sales Entry</h3>
                <p>Record sold products</p>
            </div>
        </div>
        <i class="fas fa-arrow-right arrow"></i>
    </a>

    <div class="back">
        <a th:href="@{/manager/dashboard}">← Back to Dashboard</a>
    </div>
</div>

</body>
</html>
