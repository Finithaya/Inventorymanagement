<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Purchase Entry</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
        body {
            background: #0f172a;
            color: #f1f5f9;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
        }
        .container {
            margin-top: 60px;
            max-width: 500px;
        }

      
        .card {
            background: rgba(15, 23, 42, 0.9);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.8);
        }

        h3 {
            text-align: center;
            margin-bottom: 30px;
            font-weight: 700;
        }

       
        form select, form input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 20px;
            border-radius: 12px;
            border: none;
            background: rgba(255, 255, 255, 0.05);
            color: #f1f5f9;
            font-size: 1rem;
            transition: all 0.3s;
        }

        form select:focus, form input:focus {
            outline: none;
            box-shadow: 0 0 10px #4f46e5;
            background: rgba(255, 255, 255, 0.1);
        }

       
        form select option {
            background: #0f172a;
            color: #f1f5f9;
        }

      
        button {
            width: 100%;
            padding: 12px;
            background: #4f46e5;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            background: #6366f1;
        }

       
        .text-success {
            font-weight: 600;
            text-align: center;
        }

       
        @media (max-width: 768px) {
            .card {
                padding: 20px;
            }
            h3 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h3>📥 Purchase Entry</h3>

      
        <p th:if="${success}" class="text-success mb-3" th:text="${success}"></p>

        <form th:action="@{/manager/purchase-entry/save}" method="post">
            <select name="productId" required>
                <option value="">Select Product</option>
                <option th:each="p : ${products}" th:value="${p.id}" th:text="${p.name}"></option>
            </select>

            <input type="number" name="quantity" min="1" placeholder="Enter Quantity" required>

            <button type="submit">Save Purchase</button>
        </form>
    </div>
</div>

</body>
</html>
