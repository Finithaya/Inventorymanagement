<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Sales Entry</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow-lg border-0">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">📤 New Sales Entry</h4>
        </div>

        <div class="card-body">

           
            <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

            <form th:action="@{/manager/sales-entry/save}" method="post">

                <div class="row">

                    
                    
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Product</label>
                        <select name="productId"
                                id="productSelect"
                                class="form-select"
                                required>
                            <option value="">Select Product</option>
                            <option th:each="p : ${products}"
                                    th:value="${p.id}"
                                    th:data-price="${p.price}"
                                    th:text="${p.name}">
                            </option>
                        </select>
                    </div>

                   
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Quantity</label>
                        <input type="number" id="quantity"
                               name="quantity"
                               class="form-control"
                               min="1" required>
                    </div>

                   
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Unit Price</label>
                        <input type="number" id="unitPrice"
                               name="unitPrice"
                               step="0.01"
                               class="form-control"
                               required>
                    </div>

                  
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Discount (%)</label>
                        <input type="number"
                               id="discount"
                               name="discount"
                               step="0.01"
                               class="form-control"
                               value="0">
                    </div>

                   
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Tax (%)</label>
                        <input type="number"
                               id="tax"
                               name="tax"
                               step="0.01"
                               class="form-control"
                               value="0">
                    </div>

                   
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Total Amount</label>
                        <input type="number"
                               id="totalAmount"
                               name="totalAmount"
                               class="form-control bg-light"
                               readonly>
                    </div>

                </div>

                <button class="btn btn-success w-100 mt-3">
                    💾 Save Sale
                </button>

            </form>
        </div>
    </div>

    <div class="text-center mt-4">
        <a th:href="@{/manager/dashboard}" class="btn btn-outline-secondary">
            ← Back to Dashboard
        </a>
    </div>
</div>

<script>
    const productSelect = document.getElementById("productSelect");
    const quantity = document.getElementById("quantity");
    const unitPrice = document.getElementById("unitPrice");
    const discount = document.getElementById("discount");
    const tax = document.getElementById("tax");
    const totalAmount = document.getElementById("totalAmount");

   
    productSelect.addEventListener("change", function () {
        const selectedOption = this.options[this.selectedIndex];
        const price = selectedOption.getAttribute("data-price");
        unitPrice.value = price || 0;
        calculateTotal();
    });

    function calculateTotal() {
        let qty = parseFloat(quantity.value) || 0;
        let price = parseFloat(unitPrice.value) || 0;
        let disc = parseFloat(discount.value) || 0;
        let taxRate = parseFloat(tax.value) || 0;

        let subtotal = qty * price;
        let discountAmount = subtotal * (disc / 100);
        let taxableAmount = subtotal - discountAmount;
        let taxAmount = taxableAmount * (taxRate / 100);

        totalAmount.value = (taxableAmount + taxAmount).toFixed(2);
    }

    quantity.addEventListener("input", calculateTotal);
    unitPrice.addEventListener("input", calculateTotal);
    discount.addEventListener("input", calculateTotal);
    tax.addEventListener("input", calculateTotal);
</script>

</body>
</html>
