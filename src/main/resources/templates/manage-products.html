<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Manage Products</title>
<meta charset="UTF-8">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            overflow: hidden; 
        }
        .main-container {
            height: 100vh;
            padding: 20px;
        }
        .card-custom {
            background-color: #1e2a38;
            border-radius: 15px;
            padding: 20px;
            height: 100%;
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
        }

        .form-control, .form-select {
            background-color: #2c3e50;
            border: none;
            color: white;
        }

        .form-control:focus, .form-select:focus {
            background-color: #34495e;
            color: white;
            box-shadow: none;
        }

        .table thead {
            background-color: #0d6efd;
        }

        .table tbody tr:hover {
            background-color: #2c3e50;
        }

        .table-responsive {
            max-height: 70vh;
            overflow-y: auto; 
        }

        h4 {
            font-weight: 600;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="container-fluid main-container">

    <h3 class="text-center mb-4">📦 Manage Products & Categories</h3>

    <div class="row h-100">
        <div class="col-md-3">
            <div class="card-custom">
                <h4>Add Category</h4>

                <form th:action="@{/admin/products/saveCategory}" 
                      method="post" 
                      th:object="${category}">

                    <div class="mb-3">
                        <input type="text"
                               th:field="*{name}"
                               class="form-control"
                               placeholder="Category Name" required>
                    </div>

                    <button type="submit" 
                            class="btn btn-info w-100">
                        Save
                    </button>
                </form>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card-custom">
                <h4>Add Product</h4>

                <form th:action="@{/admin/products/save}" 
                      method="post" 
                      th:object="${product}">

                    <div class="mb-2">
                        <input type="text"
                               th:field="*{name}"
                               class="form-control"
                               placeholder="Product Name" required>
                    </div>

                    <div class="mb-2">
                        <input type="number"
                               step="0.01"
                               th:field="*{price}"
                               class="form-control"
                               placeholder="Price" required>
                    </div>

                    <div class="mb-2">
                        <input type="number"
                               th:field="*{quantity}"
                               class="form-control"
                               placeholder="Stock Quantity" required>
                    </div>

                    <div class="mb-3">
                        <select th:field="*{category}"
                                class="form-select">
                            <option value="">Select Category</option>
                            <option th:each="cat : ${categories}"
                                    th:value="${cat.id}"
                                    th:text="${cat.name}">
                            </option>
                        </select>
                    </div>

                    <button type="submit"
                            class="btn btn-warning w-100">
                        Save Product
                    </button>
                </form>
            </div>
        </div>

        <div class="col-md-5">
            <div class="card-custom">
                <h4>Product List</h4>

                <div class="table-responsive">
                    <table class="table table-bordered text-light">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Price</th>
                                <th>Stock</th>
                                <th>Category</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="prod : ${products}">
                                <td th:text="${prod.id}"></td>
                                <td th:text="${prod.name}"></td>
                                <td th:text="${prod.price}"></td>
                                <td th:text="${prod.quantity}"></td>
                                <td th:text="${prod.category.name}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>

    </div>

</div>

</body>
</html>
