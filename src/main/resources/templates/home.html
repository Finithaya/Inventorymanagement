<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Inventory Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
    --bg-main: #ffffff;
    --bg-card: #f1f5f9;
    --bg-sidebar: #ffffff;
    --text-main: #0f172a;
    --text-secondary: #475569;
    --shadow: rgba(0,0,0,0.1);
}

body.dark {
    --bg-main: #0f172a;
    --bg-card: rgba(255,255,255,0.08);
    --bg-sidebar: rgba(255,255,255,0.05);
    --text-main: #f1f5f9;
    --text-secondary: #cbd5e1;
    --shadow: rgba(0,0,0,0.5);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

body {
    background: var(--bg-main);
    display: flex;
    min-height: 100vh;
    transition: 0.4s ease;
}


.sidebar {
    width: 250px;
    background: var(--bg-sidebar);
    backdrop-filter: blur(15px);
    border-right: 1px solid rgba(0,0,0,0.05);
    padding: 30px 20px;
    transition: 0.4s ease;
}

.sidebar h2 {
    text-align: center;
    margin-bottom: 40px;
    color: var(--text-main);
}

.nav-link {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    margin-bottom: 15px;
    border-radius: 12px;
    text-decoration: none;
    color: var(--text-secondary);
    transition: 0.3s ease;
}

.nav-link:hover {
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    color: white;
    transform: translateX(5px);
}


.main {
    flex: 1;
    padding: 40px;
}


.header {
    background: var(--bg-card);
    padding: 25px 30px;
    border-radius: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 50px;
    box-shadow: 0 10px 30px var(--shadow);
    transition: 0.4s ease;
}

.header h1 {
    color: var(--text-main);
}


.theme-toggle {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: white;
    transition: 0.3s ease;
}

.theme-toggle:hover {
    transform: rotate(20deg) scale(1.1);
}


.logout-btn {
    background: linear-gradient(135deg, #ef4444, #dc2626);
    padding: 12px 20px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 600;
    color: white;
}


.cards {
    max-width: 950px;
    margin: auto;
    display: flex;
    flex-direction: column;
    gap: 30px;
}

.card {
    background: var(--bg-card);
    border-radius: 20px;
    padding: 30px;
    transition: 0.4s ease;
    box-shadow: 0 15px 40px var(--shadow);
}

.card:hover {
    transform: translateY(-6px) scale(1.02);
}

.card a {
    text-decoration: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--text-main);
}

.card-left {
    display: flex;
    align-items: center;
    gap: 25px;
}

.icon-box {
    width: 70px;
    height: 70px;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    color: white;
}

.admin-icon {
    background: linear-gradient(135deg, #3b82f6, #2563eb);
}

.manager-icon {
    background: linear-gradient(135deg, #22c55e, #16a34a);
}

.report-icon {
    background: linear-gradient(135deg, #f59e0b, #d97706);
}

.card-text p {
    color: var(--text-secondary);
}
</style>
</head>
<body>
<div class="main">
<div class="header">
    <h1>Inventory Management Dashboard</h1>
    <div style="display:flex; gap:15px; align-items:center;">
        <div class="theme-toggle" onclick="toggleTheme()">
            <i class="fas fa-moon"></i>
        </div>
       <a th:href="@{/logout}" class="logout-btn">
            <i class="fas fa-sign-out-alt"></i> Logout
        </a>
    </div>
</div>

<div class="cards">

    <div class="card">
        <a th:href="@{/admin}">
            <div class="card-left">
                <div class="icon-box admin-icon">
                    <i class="fas fa-user-shield"></i>
                </div>
                <div class="card-text">
                    <h3>Admin Panel</h3>
                    <p>Manage users, products, and system configuration</p>
                </div>
            </div>
            <i class="fas fa-arrow-right"></i>
        </a>
    </div>

    <div class="card">
        <a th:href="@{/manager-login}">
            <div class="card-left">
                <div class="icon-box manager-icon">
                    <i class="fas fa-users"></i>
                </div>
                <div class="card-text">
                    <h3>Manager Panel</h3>
                    <p>Oversee inventory operations and approvals</p>
                </div>
            </div>
            <i class="fas fa-arrow-right"></i>
        </a>
    </div>

    <div class="card">
        <a th:href="@{/reports}">
            <div class="card-left">
                <div class="icon-box report-icon">
                    <i class="fas fa-chart-bar"></i>
                </div>
                <div class="card-text">
                    <h3>Reports & Analytics</h3>
                    <p>View stock reports and performance insights</p>
                </div>
            </div>
            <i class="fas fa-arrow-right"></i>
        </a>
    </div>

</div>
</div>

<script>
function toggleTheme() {
    document.body.classList.toggle("dark");
    if (document.body.classList.contains("dark")) {
        localStorage.setItem("theme", "dark");
        document.querySelector(".theme-toggle i").className = "fas fa-sun";
    } else {
        localStorage.setItem("theme", "light");
        document.querySelector(".theme-toggle i").className = "fas fa-moon";
    }
}

window.onload = function() {
    const savedTheme = localStorage.getItem("theme");
    if (savedTheme === "dark") {
        document.body.classList.add("dark");
        document.querySelector(".theme-toggle i").className = "fas fa-sun";
    }
}
</script>

</body>
</html>
