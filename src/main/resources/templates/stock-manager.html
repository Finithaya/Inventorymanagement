<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Stock Management</title>
<meta charset="UTF-8">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
        body {
            background: linear-gradient(135deg,#16222a,#3a6073);
            color: white;
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            color: white;
        }

        .header {
            text-align: center;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
        }

        .table thead {
            background-color: rgba(255,255,255,0.2);
        }

        .low-stock {
            background-color: rgba(255,0,0,0.3);
        }
    </style>
</head>
<body>

<div class="header">INVENTORY MANAGER - STOCK UPDATE</div>

<div class="container mt-4">

    <div class="card p-4">
        <h5>Product Stock List</h5>

        <table class="table table-hover mt-3">
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Current Stock</th>
                <th>Update Stock</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${products}"
                th:classappend="${p.stock < 10} ? 'low-stock'">

                <td th:text="${p.id}"></td>
                <td th:text="${p.name}"></td>
                <td th:text="${p.stock}"></td>

                <td>
                    <form th:action="@{/manager/inventory/update}" method="post" class="d-flex">

                        <input type="hidden" name="productId" th:value="${p.id}"/>

                        <input type="number" name="quantityChange"
                               class="form-control me-2"
                               placeholder="+ or - value"
                               required>

                        <button type="submit" class="btn btn-primary">
                            Update
                        </button>
                    </form>
                </td>

            </tr>
            </tbody>
        </table>

        <small>* Red rows indicate low stock (less than 10).</small>
    </div>

</div>

</body>
</html>
