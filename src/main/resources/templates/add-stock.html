<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Add & Update Stock</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
<div class="container mt-5">
<h2 class="text-center mb-4">Add & Update Stock</h2>
<table class="table table-dark table-bordered">
        <thead>
        <tr>
            <th>Product</th>
            <th>Current Qty</th>
            <th>Add Qty</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${products}">
            <td th:text="${p.name}"></td>
            <td th:text="${p.quantity}"></td>
            <td>
                <form th:action="@{/manager/update-stock}" method="post" class="d-flex gap-2">
                    <input type="hidden" name="productId" th:value="${p.id}">
                    <input type="number" name="addedQuantity" min="1"
                           class="form-control" placeholder="Add qty" required>
            </td>
            <td>
                    <button class="btn btn-success">Update</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <div class="text-center mt-4">
        <a th:href="@{/manager/dashboard}" class="btn btn-secondary">
            Back to Dashboard
        </a>
    </div>
</div>

</body>
</html>
