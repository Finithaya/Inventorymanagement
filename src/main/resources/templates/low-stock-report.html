<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Low Stock Alert Report</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f1f5f9;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
        }

        h2 {
            font-weight: 700;
            margin-bottom: 30px;
            color: #fbbf24; 
            text-shadow: 0 0 8px #fbbf24;
        }

        .card {
            background: rgba(30, 41, 59, 0.85);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.8);
        }

        .table-responsive {
            border-radius: 15px;
            overflow: hidden;
        }

        .table {
            background: rgba(15,23,42,0.85);
            border-radius: 12px;
        }

        .table thead {
            background: rgba(251,191,36,0.9); 
            color: #0f172a;
            font-weight: 600;
        }

        .table-striped > tbody > tr:nth-of-type(odd) {
            background-color: rgba(255,255,255,0.05);
        }

        .table tbody tr:hover {
            background-color: rgba(255,255,255,0.1);
            transform: scale(1.01);
            transition: all 0.2s;
        }

        .badge-low {
            background: #f87171; 
            font-weight: 600;
            font-size: 0.9rem;
        }

        .text-stock {
            font-weight: 600;
            color: #f87171;
        }

        .btn-back {
            margin-top: 20px;
            border: 2px solid #f1f5f9;
            color: #f1f5f9;
            border-radius: 12px;
            padding: 8px 20px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-back:hover {
            background: #f1f5f9;
            color: #0f172a;
        }

        @media (max-width: 768px) {
            .card {
                padding: 20px;
            }
            h2 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="card">

        <h2 class="text-center">⚠ Low Stock Alert Report</h2>

        <div class="table-responsive mt-4">
            <table class="table table-bordered table-striped table-hover text-light">

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Product Name</th>
                        <th>Category</th>
                        <th>Current Stock</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="product : ${products}">
                        <td th:text="${product.id}"></td>
                        <td th:text="${product.name}"></td>
                        <td th:text="${product.category != null ? product.category.name : 'N/A'}"></td>
                        <td><span class="text-stock" th:text="${product.quantity}"></span></td>
                        <td><span class="badge badge-low">Low Stock</span></td>
                    </tr>

                    <tr th:if="${products == null or #lists.isEmpty(products)}">
                        <td colspan="5" class="text-center text-success">
                            ✅ All products are sufficiently stocked
                        </td>
                    </tr>
                </tbody>

            </table>
        </div>

        <div class="text-center">
            <a th:href="@{/manager/dashboard}" class="btn btn-back">
                ← Back to Dashboard
            </a>
        </div>

    </div>
</div>

</body>
</html>
