<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Supplier Management</title>
<meta charset="UTF-8">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
        body {
            background: linear-gradient(135deg,#141e30,#243b55);
            color: white;
            font-family: 'Segoe UI', sans-serif;
        }
        .card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(8px);
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            color: white;
        }
       .btn-primary {
            background-color: #0d6efd;
            border: none;
        }
       .table thead {
            background-color: rgba(255,255,255,0.2);
        }
       .header {
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="header">SUPPLIER MANAGEMENT</div>

<div class="container mt-4">

    <div class="row">

       
        <div class="col-md-4">
            <div class="card p-4">
                <h5>Add / Edit Supplier</h5>

                <form th:action="@{/admin/suppliers/save}"
                      method="post"
                      th:object="${supplier}">

                    <input type="hidden" th:field="*{id}"/>

                    <input type="text" th:field="*{name}"
                           class="form-control mb-2"
                           placeholder="Supplier Name" required>

                    <input type="email" th:field="*{email}"
                           class="form-control mb-2"
                           placeholder="Email">

                    <input type="text" th:field="*{phone}"
                           class="form-control mb-2"
                           placeholder="Phone">

                    <input type="text" th:field="*{companyName}"
                           class="form-control mb-2"
                           placeholder="Company Name">

                    <textarea th:field="*{address}"
                              class="form-control mb-3"
                              placeholder="Address"></textarea>

                    <button type="submit" class="btn btn-primary w-100">
                        Save Supplier
                    </button>
                </form>
            </div>
        </div>
        <div class="col-md-8">
            <div class="card p-4">
              <div class="d-flex justify-content-between mb-3">
                    <h5>Supplier List</h5>

                    <form th:action="@{/admin/suppliers/search}" method="get">
                        <div class="input-group">
                            <input type="text" name="keyword"
                                   class="form-control"
                                   placeholder="Search supplier...">
                            <button class="btn btn-primary">Search</button>
                        </div>
                    </form>
                </div>

                <table class="table table-hover">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Company</th>
                        <th>Phone</th>
                        <th>Email</th>
                        <th>Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="sup : ${suppliers}">
                        <td th:text="${sup.id}"></td>
                        <td th:text="${sup.name}"></td>
                        <td th:text="${sup.companyName}"></td>
                        <td th:text="${sup.phone}"></td>
                        <td th:text="${sup.email}"></td>
                        <td>
                            <a th:href="@{'/admin/suppliers/edit/' + ${sup.id}}"
                               class="btn btn-warning btn-sm">Edit</a>
                            <a th:href="@{'/admin/suppliers/delete/' + ${sup.id}}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('Are you sure?')">
                                Delete
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>

            </div>
        </div>

    </div>

</div>

</body>
</html>
