<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>View Reports</title>
<meta charset="UTF-8">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
        body {
            background: linear-gradient(135deg,#1e3c72,#2a5298);
            color: white;
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            color: white;
        }

        .header {
            text-align: center;
            padding: 20px;
            font-size: 26px;
            font-weight: bold;
        }

        .stat-number {
            font-size: 28px;
            font-weight: bold;
        }

        .table thead {
            background-color: rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>
<div class="header">
    INVENTORY REPORTS & ANALYTICS
</div>

<div class="container mt-4">

    
    <div class="row text-center mb-4">

        <div class="col-md-3">
            <div class="card p-3">
                <div>Total Products</div>
                <div class="stat-number" th:text="${totalProducts}"></div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card p-3">
                <div>Total Suppliers</div>
                <div class="stat-number" th:text="${totalSuppliers}"></div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card p-3">
                <div>Total Categories</div>
                <div class="stat-number" th:text="${totalCategories}"></div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card p-3">
                <div>Total Inventory Value</div>
                <div class="stat-number">
                    ₹ <span th:text="${totalInventoryValue}"></span>
                </div>
            </div>
        </div>

    </div>

    
    <div class="card p-4">
        <h5>Low Stock Products </h5>

        <table class="table table-hover mt-3">
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Stock</th>
                <th>Price</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${lowStockProducts}">
                <td th:text="${p.id}"></td>
                <td th:text="${p.name}"></td>
              <td th:text="${p.quantity}"></td>
                <td th:text="${p.price}"></td>
            </tr>
            </tbody>
        </table>
    </div>

</div>

</body>
</html>
